name: KiteShield CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        env:
          APP_ENV: test
          SEPOLIA_RPC_URL: https://mock-rpc.sepolia.org
          CAPABILITY_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          API_KEY: test-ci-api-key-32-chars-long-abcdef
          SIGNER_PRIVATE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          pytest --cov=app --cov-report=term-missing

  frontend-verification:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Linter (Oxlint)
        run: |
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          npx tsc -b

      - name: Build Production Bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_API_KEY: ci-build-test-key
        run: |
          npm run build

  secret-leak-audit:
    name: Secret & Credential Leak Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Accidentally Tracked Secrets
        run: |
          echo "Auditing tracked files for forbidden .env and secret patterns..."
          if git ls-files | grep -E "(^|/)\.env($|\.local$|\.production$|\.development$)"; then
            echo "ERROR: Tracked .env file detected in git!"
            exit 1
          fi
          if git ls-files | grep -E "\.(key|pem|p12|jks)$"; then
            echo "ERROR: Tracked cryptographic key file detected in git!"
            exit 1
          fi
          if git ls-files | grep -E "\.(db|sqlite|sqlite3)$"; then
            echo "ERROR: Tracked database file detected in git!"
            exit 1
          fi
          echo "Secret audit PASSED: No sensitive files tracked."
